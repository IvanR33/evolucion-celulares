<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronología técnica de hitos del hardware móvil - Iván Ignacio</title>
    <link href="style.css" type="text/css" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Cronología técnica de hitos del hardware móvil</h1>
        <p class="subtitle">Proyecto HTML5 + CSS3 + JavaScript • Unidad 2 - INACAP 2026</p>
        <nav>
            <ul>
                <li><a href="#registro">Registro</a></li>
                <li><a href="#login">Login</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="registro">
            <h2>Formulario de Registro</h2>
            <div class="formulario-contenedor">
                <form id="formRegistro">
                    <div class="campo">
                        <label for="regUser">Usuario:</label>
                        <input type="text" id="regUser" required>
                    </div>
                    <div class="campo">
                        <label for="regEmail">Email:</label>
                        <input type="email" id="regEmail" required>
                        <div id="errEmail" class="error-msg"></div>
                    </div>
                    <div class="campo">
                        <label for="regPass">Contraseña (mín. 8 caracteres):</label>
                        <input type="password" id="regPass" required>
                        <div id="errPass" class="error-msg"></div>
                    </div>
                    <div class="campo">
                        <label for="regPassConf">Confirmar Contraseña:</label>
                        <input type="password" id="regPassConf" required>
                        <div id="errPassConf" class="error-msg"></div>
                    </div>
                    <button type="submit" class="btn-enviar">Crear Cuenta</button>
                </form>
            </div>
        </section>

        <section id="login">
            <h2>Acceso de Usuario</h2>
            <div class="formulario-contenedor">
                <form id="formLogin">
                    <div class="campo">
                        <label for="logEmail">Email:</label>
                        <input type="email" id="logEmail" required>
                    </div>
                    <div class="campo">
                        <label for="logPass">Contraseña:</label>
                        <input type="password" id="logPass" required>
                    </div>
                    <div id="logFeedback"></div>
                    <button type="submit" class="btn-enviar">Ingresar</button>
                </form>
            </div>
        </section>

        <section id="contacto">
            <h2>Formulario de Contacto</h2>
            <div class="formulario-contenedor">
                <form id="formContacto">
                    <div class="campo">
                        <label for="conNombre">Nombre:</label>
                        <input type="text" id="conNombre" required>
                    </div>
                    <div class="campo">
                        <label for="conAsunto">Asunto:</label>
                        <input type="text" id="conAsunto" required>
                    </div>
                    <div class="campo">
                        <label for="conMensaje">Mensaje:</label>
                        <textarea id="conMensaje" rows="5" required></textarea>
                        <div id="charCount" class="char-counter">Caracteres: 0</div>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Iván Ignacio | Analista Programador - INACAP La Granja</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. REGISTRO (Validación Preventiva y Regex)
            const formReg = document.getElementById('formRegistro');
            formReg.addEventListener('submit', (e) => {
                e.preventDefault(); // Requisito: preventDefault()
                
                // Limpiar mensajes previos
                document.querySelectorAll('.error-msg').forEach(el => el.textContent = '');

                const email = document.getElementById('regEmail').value;
                const pass = document.getElementById('regPass').value;
                const passConf = document.getElementById('regPassConf').value;
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // Requisito: Regex

                let esValido = true;

                if (!emailRegex.test(email)) {
                    document.getElementById('errEmail').textContent = 'Formato de email inválido.';
                    esValido = false;
                }
                if (pass.length < 8) {
                    document.getElementById('errPass').textContent = 'La contraseña debe tener al menos 8 caracteres.';
                    esValido = false;
                }
                if (pass !== passConf) {
                    document.getElementById('errPassConf').textContent = 'Las contraseñas no coinciden.';
                    esValido = false;
                }

                if (esValido) {
                    alert('¡Registro exitoso!');
                    formReg.reset();
                }
            });

            // 2. LOGIN (Feedback en tiempo real)
            const formLog = document.getElementById('formLogin');
            formLog.addEventListener('submit', (e) => {
                e.preventDefault();
                const feedback = document.getElementById('logFeedback');
                feedback.innerHTML = '<p class="success-msg">¡Ingreso exitoso! Bienvenido.</p>';
            });

            // 3. CONTACTO (Contador y Limpieza)
            const txtMensaje = document.getElementById('conMensaje');
            const charCount = document.getElementById('charCount');

            // Contador de caracteres en tiempo real
            txtMensaje.addEventListener('input', () => {
                charCount.textContent = `Caracteres: ${txtMensaje.value.length}`;
            });

            const formCon = document.getElementById('formContacto');
            formCon.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Mensaje enviado. Limpiando campos...');
                formCon.reset(); // Requisito: Limpiar automáticamente
                charCount.textContent = 'Caracteres: 0';
            });
        });
    </script>
</body>
</html>
