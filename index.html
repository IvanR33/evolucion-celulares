<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Mobile History</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">NEXTGEN</div>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active" data-section="hero">Inicio</a></li>
                <li><a href="#" class="nav-link" data-section="hitos">Hitos</a></li>
                <li><a href="#" class="nav-link" data-section="registro">Registro</a></li>
                <li><a href="#" class="nav-link" data-section="contacto">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section id="hero" class="section active">
            <div class="hero">
                <h1>MÓVIL ÉPOCA</h1>
                <p>Explora la evolución tecnológica que cambió el mundo.</p>
                
                <div class="carousel-container">
                    <button id="prevBtn" class="btn-nav">❮</button>
                    <div class="carousel-track">
                        <img src="Motorola-StarTAC.jpg" class="carousel-img active" alt="Motorola StarTAC">
                        <img src="Nokia-3310.jpg" class="carousel-img" alt="Nokia 3310">
                        <img src="Sony-Ericsson-T68i.jpg" class="carousel-img" alt="Sony Ericsson T68i">
                    </div>
                    <button id="nextBtn" class="btn-nav">❯</button>
                </div>
            </div>
        </section>

        <section id="hitos" class="section">
            <h2 class="section-title">Hitos Tecnológicos</h2>
            <div class="hitos-grid">
                <div class="hito-card" data-modal="startac">
                    <img src="Motorola-StarTAC.jpg" alt="StarTAC">
                    <div class="hito-info"><h3>Motorola StarTAC</h3></div>
                </div>
                <div class="hito-card" data-modal="nokia3310">
                    <img src="Nokia-3310.jpg" alt="Nokia 3310">
                    <div class="hito-info"><h3>Nokia 3310</h3></div>
                </div>
                <div class="hito-card" data-modal="kyocera">
                    <img src="Kyocera VP-210.jpeg" alt="Kyocera">
                    <div class="hito-info"><h3>Kyocera VP-210</h3></div>
                </div>
            </div>
        </section>

        <section id="registro" class="section">
            <div class="form-container">
                <div class="card">
                    <h2>Inscripción de Usuario</h2>
                    <form id="formRegistro">
                        <div class="input-group">
                            <label for="regNombre">Nombre Completo</label>
                            <input type="text" id="regNombre" required>
                        </div>
                        <div class="input-group">
                            <label for="regEmail">Correo Electrónico</label>
                            <input type="email" id="regEmail" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrar</button>
                    </form>
                </div>
                
                <div class="card" style="margin-top: 30px;">
                    <h2>Login</h2>
                    <form id="formLogin">
                        <div class="input-group">
                            <label for="logEmail">Email</label>
                            <input type="email" id="logEmail" required>
                        </div>
                        <div id="logFeedback"></div>
                        <button type="submit" class="btn btn-accent">Entrar</button>
                    </form>
                </div>
            </div>
        </section>

        <section id="contacto" class="section">
            <div class="form-container">
                <div class="card">
                    <h2>Contacto</h2>
                    <form id="formContacto">
                        <div class="input-group">
                            <label for="conNombre">Nombre</label>
                            <input type="text" id="conNombre" required>
                        </div>
                        <div class="input-group">
                            <label for="conEmail">Email</label>
                            <input type="email" id="conEmail" required>
                        </div>
                        <div class="input-group">
                            <label for="conMensaje">Mensaje</label>
                            <textarea id="conMensaje" rows="4" required></textarea>
                            <p id="charCount" class="char-counter">Caracteres: 0</p>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
